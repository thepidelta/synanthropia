<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Συνανθρωπιά - Δράσεις και timeline." />
  <title>Συνανθρωπιά | Δράσεις</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Manrope:wght@300;400;500;700&family=Noto+Serif:wght@500;700&display=swap" rel="stylesheet" />
  <script>
    (function () {
      try {
        var lang = window.localStorage.getItem("synanthropia-lang");
        if (lang && lang !== "el") {
          document.documentElement.setAttribute("data-lang-pending", "true");
        }
      } catch (error) {}
    })();
  </script>
  <link rel="stylesheet" href="css/style.css?v=20260326-1" />
</head>
<body>
  <header class="site-header" id="home">
    <div class="header-inner">
      <a class="brand" href="preview.html" aria-label="Synanthropia home">
        <img class="brand-logo" src="images/logo-nb-square.png?v=2" alt="Λογότυπο Συνανθρωπιά" />
        <span class="brand-name">Συνανθρωπιά</span>
      </a>

      <nav class="main-nav" aria-label="Main navigation">
        <a data-i18n="nav_home" href="preview.html">Αρχική</a>
        <a data-i18n="nav_about" href="about.html">Σχετικά με εμάς</a>
        <a data-i18n="nav_actions" href="actions.html">Δράσεις</a>
        <a data-i18n="nav_projects" href="projects.html">Projects</a>
        <a data-i18n="nav_members" href="members.html">Μέλη & Εταίροι</a>
        <a data-i18n="nav_forms" href="forms.html">Αιτήσεις</a>
        <a data-i18n="nav_donate" href="donate.html">Δωρεά</a>
        <a data-i18n="nav_contact" href="contact.html">Επικοινωνία</a>
      </nav>

      <div class="language-switcher" aria-label="Language selector">
        <button class="lang-btn active" data-lang="el" type="button">🇬🇷</button>
        <button class="lang-btn" data-lang="en" type="button">🇬🇧</button>
        <button class="lang-btn" data-lang="de" type="button">🇩🇪</button>
      </div>
    </div>
  </header>

  <main>
    <section class="timeline section-pad">
      <div class="container">
        <div class="section-head" style="text-align: center; max-width: 100%;">
          <h2 data-i18n="timeline_title">Χρονολόγιο δράσεων</h2>
          <p data-i18n="timeline_subtitle">Νεότερες δράσεις στην κορυφή. Με κύλιση προς τα κάτω βλέπεις παλαιότερες.</p>
        </div>
        <div class="timeline-controls" role="toolbar" aria-label="Timeline filters" style="justify-content: center;">
          <button class="filter-btn active" data-filter="all" data-i18n="filter_all" type="button">Όλα</button>
          <button class="filter-btn" data-filter="human" data-i18n="filter_human" type="button">Άνθρωπος</button>
          <button class="filter-btn" data-filter="animals" data-i18n="filter_animals" type="button">Ζώα</button>
          <button class="filter-btn" data-filter="environment" data-i18n="filter_environment" type="button">Περιβάλλον</button>
        </div>
        <div id="timeline-list" class="timeline-list" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> Συνανθρωπιά | AMKE</p>
  </footer>

  <script src="js/main.js?v=20260326-1"></script>
</body>
</html>
